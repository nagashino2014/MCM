<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>MCM 알림 브리지</title>
  </head>
  <body>
    <script>
      /*
        데스크탑 위젯 PC 알림 브리지(2026-11-12) — 위젯 셸(apps/desktop/src/index.html)이 숨은 iframe 으로 불러온다.
        koensain.app 출처라 m-app(같은 출처, 같은 위젯 웹뷰)의 로그인 토큰(localStorage mcm.accessToken)을 그대로 쓴다.
        15초마다 /api/notify/pc-feed 를 불러 새 메일·내 차례 결재·내 문서 결과·메신저 새 메시지를 셸로 올리면,
        셸이 Windows 알림(클릭하면 그 화면으로)을 띄운다. m-app 코드·재export 와 무관하게 next 배포만으로 바뀐다.

        - 셸이 먼저 mcm:bridge-hello 로 자기 출처를 밝힌 뒤에만, 그 출처로만 보낸다(아래 허용 목록 밖이면 무시).
        - 토큰 갱신(refresh)은 하지 않는다 — m-app 이 같은 저장소에서 갱신한다(둘이 동시에 갱신하면 refresh 회전이 꼬인다).
          401 이면 이번 차례만 건너뛴다.
        - 처음(기준선 없음)에는 서버 현재 시각을 기준선으로만 잡는다 — 켜자마자 쌓인 것이 쏟아지지 않게.
        - 요청에 X-MCM-Client: pc-widget 을 붙여 서버가 "이 사용자의 위젯이 켜져 있음"을 알게 한다(웹 알림 양보).
      */
      (function () {
        var SHELL_ORIGINS = ["http://tauri.localhost", "https://tauri.localhost", "tauri://localhost", "http://127.0.0.1:1430"];
        var KINDS = ["mail", "approval", "chat"];
        var MARK = "mcm:pcw:mark:";
        var POLL_MS = 15000;
        var MAX_EACH = 3;
        var BATCH = {
          mail: function (n) { return "새 메일 " + n + "통"; },
          approval: function (n) { return "전자결재 알림 " + n + "건"; },
          chat: function (n) { return "새 메시지 " + n + "건"; },
        };
        var shellOrigin = null;
        var timer = null;
        var busy = false;

        function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 무시 */ } }
        function post(msg) { if (shellOrigin) window.parent.postMessage(msg, shellOrigin); }

        function call(qs) {
          var token = get("mcm.accessToken");
          if (!token) return Promise.resolve({ status: "guest" });
          return fetch("/api/notify/pc-feed" + (qs ? "?" + qs : ""), {
            cache: "no-store",
            headers: { Authorization: "Bearer " + token, "X-MCM-Client": "pc-widget" },
          }).then(function (r) {
            if (!r.ok) return { status: r.status === 401 ? "expired" : "error" };
            return r.json().then(function (d) { return { status: "ok", data: d }; });
          }).catch(function () { return { status: "error" }; });
        }

        function tick() {
          if (busy || !shellOrigin) return;
          busy = true;
          var marks = {};
          var missing = false;
          KINDS.forEach(function (k) { marks[k] = get(MARK + k); if (!marks[k]) missing = true; });
          var qs = missing ? "" : KINDS.map(function (k) { return k + "=" + encodeURIComponent(marks[k]); }).join("&");
          call(qs).then(function (res) {
            post({ type: "mcm:bridge-status", status: res.status });
            if (res.status !== "ok") return;
            var d = res.data;
            if (missing) {
              KINDS.forEach(function (k) { if (!marks[k]) set(MARK + k, d.serverNow); });
              return;
            }
            var out = [];
            KINDS.forEach(function (k) {
              var sec = d[k];
              if (!sec || !sec.items || !sec.items.length) return;
              var newest = marks[k];
              sec.items.forEach(function (it) { if (it.at > newest) newest = it.at; });
              set(MARK + k, newest);
              if (sec.total <= MAX_EACH) {
                sec.items.slice().reverse().forEach(function (it) {
                  out.push({ kind: k, key: it.key, title: it.title, body: it.body, target: it.target });
                });
              } else {
                var top = sec.items[0];
                out.push({ kind: k, key: "batch-" + top.key, title: BATCH[k](sec.total), body: top.title + ": " + top.body + " 외 " + (sec.total - 1) + "건", target: { kind: k } });
              }
            });
            if (out.length) post({ type: "mcm:pc-notify", items: out });
          }).then(function () { busy = false; }, function () { busy = false; });
        }

        window.addEventListener("message", function (e) {
          if (e.source !== window.parent || SHELL_ORIGINS.indexOf(e.origin) < 0) return;
          var d = e.data;
          if (!d || d.type !== "mcm:bridge-hello") return;
          shellOrigin = e.origin;
          post({ type: "mcm:bridge-ready" });
          if (!timer) {
            tick();
            timer = setInterval(tick, POLL_MS);
          }
        });
        // 셸이 로드 시점을 놓쳐도 되도록 이쪽에서 먼저 알린다(내용 없는 신호).
        if (window.parent !== window) window.parent.postMessage({ type: "mcm:bridge-loaded" }, "*");
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>MCM</title>
    <style>
      /*
        위젯 셸 — OS 창 장식(decorations:false) 대신 자체 상단 바를 그린다.
        앱 화면은 iframe 으로 원격(koensain.app/m-app)을 그대로 싣는다.
        상단 바가 하는 일: 드래그 이동 · 항상 위 고정 토글 · 최소화/최대화/닫기(트레이로).

        색·굵기·반경은 KESI Frosted(2026-11-04) — 값은 apps/mobile/src/theme/tokens.ts 의 LIGHT/DARK 와 같다
        (card·cardBorder·text·muted·surface·primaryFill·pillSelected). 글꼴 굵기 ≤600, 반경 10.
        테마: 기본은 OS(prefers-color-scheme), 앱이 mcm:theme 로 알려 주면 그 값(data-theme)이 우선 — 앱을 라이트로
        고정했는데 상단 바만 다크로 남던 문제(11-04)의 해법.
      */
      :root {
        --bar-bg: #ffffff;
        --bar-border: #e8e9ee;
        --ink: #21232c;
        --ink-muted: #646a78;
        --surface: #f6f7f9;
        --pill: #e6e8ee;
        --primary: #4a63d8;
        --primary-fill: #4a63d8;
        --track: #d1d4dc;
        --danger: #b92727;
        --frame-bg: #eef1f8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bar-bg: #1a1d23;
          --bar-border: #343742;
          --ink: #e7e9ee;
          --ink-muted: #a1a8b5;
          --surface: #24262e;
          --pill: #2b2e38;
          --primary: #a9b8ff;
          --primary-fill: #5269dc;
          --track: #484d5b;
          --frame-bg: #141520;
        }
      }
      :root[data-theme="dark"] {
        --bar-bg: #1a1d23;
        --bar-border: #343742;
        --ink: #e7e9ee;
        --ink-muted: #a1a8b5;
        --surface: #24262e;
        --pill: #2b2e38;
        --primary: #a9b8ff;
        --primary-fill: #5269dc;
        --track: #484d5b;
        --frame-bg: #141520;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: var(--frame-bg); }
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        display: flex; flex-direction: column; color: var(--ink);
      }
      #bar {
        height: 38px; flex: 0 0 38px; display: flex; align-items: center; gap: 6px;
        padding: 0 6px 0 14px; background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
        user-select: none; -webkit-user-select: none;
      }
      #title { font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -.1px; }
      #spacer { flex: 1; height: 100%; }
      /* 항상 위 고정 토글 */
      #pin {
        display: flex; align-items: center; gap: 7px; padding: 5px 9px; margin-right: 2px;
        font-size: 12px; font-weight: 500; color: var(--ink-muted); cursor: pointer; border-radius: 10px;
      }
      #pin:hover { background: var(--surface); }
      #pin .sw {
        width: 32px; height: 18px; border-radius: 99px; background: var(--track);
        position: relative; transition: background .15s;
      }
      #pin .sw::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
        border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
        transition: transform .15s;
      }
      #pin.on { color: var(--primary); font-weight: 600; }
      #pin.on .sw { background: var(--primary-fill); }
      #pin.on .sw::after { transform: translateX(14px); }
      /* 창 버튼 */
      .btn {
        width: 36px; height: 30px; display: grid; place-items: center; border: 0;
        background: transparent; cursor: pointer; border-radius: 10px; color: var(--ink-muted);
      }
      .btn:hover { background: var(--surface); color: var(--ink); }
      .btn.close:hover { background: var(--danger); color: #fff; }
      iframe { flex: 1; width: 100%; border: 0; display: block; background: transparent; }
    </style>
  </head>
  <body>
    <div id="bar" data-tauri-drag-region>
      <span id="title" data-tauri-drag-region>MCM</span>
      <div id="spacer" data-tauri-drag-region></div>

      <div id="pin" title="다른 창 위에 항상 표시합니다">
        <span>항상 위</span><span class="sw"></span>
      </div>

      <button class="btn" id="min" title="최소화" aria-label="최소화">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="btn" id="max" title="최대화 / 이전 크기" aria-label="최대화">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="btn close" id="close" title="닫기(트레이로 내려갑니다)" aria-label="닫기">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <iframe id="app" src="https://koensain.app/m-app" title="MCM"></iframe>

    <script>
      const { getCurrentWindow } = window.__TAURI__.window;
      const { invoke } = window.__TAURI__.core;
      const notification = window.__TAURI__.notification;
      const win = getCurrentWindow();
      const APP_ORIGIN = "https://koensain.app";

      const pin = document.getElementById("pin");
      let pinned = false;
      pin.addEventListener("click", async () => {
        pinned = !pinned;
        pin.classList.toggle("on", pinned);
        await win.setAlwaysOnTop(pinned);
      });

      document.getElementById("min").addEventListener("click", () => win.minimize());
      document.getElementById("max").addEventListener("click", () => win.toggleMaximize());
      // 닫기 = 종료가 아니라 트레이로(메신저는 계속 떠 있어야 알림을 받는다).
      document.getElementById("close").addEventListener("click", () => win.hide());

      /*
        웹앱(iframe) → 셸 브리지(WID-P1).
        iframe 은 원격 오리진이라 Tauri API 를 직접 못 쓴다. 대신 웹앱이 미읽음 폴링 결과를
        postMessage 로 올려주고, 여기서 트레이 뱃지·OS 알림으로 옮긴다.
      */
      let notifyAllowed = false;
      (async () => {
        try {
          notifyAllowed = await notification.isPermissionGranted();
          if (!notifyAllowed) {
            notifyAllowed = (await notification.requestPermission()) === "granted";
          }
        } catch (_) {
          notifyAllowed = false;
        }
      })();

      // 웹앱은 셸의 오리진을 모르면 아무 것도 보내지 않는다 → 먼저 hello 로 밝힌다.
      const appFrame = document.getElementById("app");
      const sayHello = () => {
        try {
          appFrame.contentWindow.postMessage({ type: "mcm:widget-hello" }, APP_ORIGIN);
        } catch (_) {
          /* 아직 로드 전 — 아래 재시도가 처리한다 */
        }
      };
      appFrame.addEventListener("load", () => {
        sayHello();
        // 웹앱(React)이 마운트되기 전일 수 있어 몇 번 더 두드린다.
        [500, 1500, 4000].forEach((ms) => setTimeout(sayHello, ms));
      });

      // 뱃지 = 메신저 미읽음 + 오늘 할 일(WID-P3). 둘은 따로 들어오므로 마지막 값을 합산한다.
      let unreadCount = 0;
      let todoCount = 0;
      const pushBadge = () => invoke("set_unread", { count: unreadCount + todoCount }).catch(() => {});

      // 창을 보고 있는 중이면 알림은 군더더기다.
      const notifyIfAway = async (title, body) => {
        if (!notifyAllowed) return;
        const [visible, focused] = await Promise.all([
          win.isVisible().catch(() => false),
          win.isFocused().catch(() => false),
        ]);
        if (visible && focused) return;
        try {
          notification.sendNotification({ title, body });
        } catch (_) {
          /* 알림 실패는 무시(뱃지는 이미 반영됨) */
        }
      };

      // 처음 받은 값은 기준선으로만 쓴다 — 켜자마자 쌓여 있던 미읽음·오늘 할 일로 알림이 쏟아지면 안 된다.
      // 메신저는 최근 메시지 키, 할 일은 날짜 키(하루 1회)로 각각 변화를 본다.
      const lastSeen = { unread: null, todo: null };
      const bump = (kind, latest) => {
        if (!latest || !latest.key) return false;
        const first = lastSeen[kind] === null;
        const changed = latest.key !== lastSeen[kind];
        lastSeen[kind] = latest.key;
        return !first && changed;
      };

      window.addEventListener("message", async (e) => {
        if (e.origin !== APP_ORIGIN) return;
        const d = e.data;
        if (d && d.type === "mcm:widget-ready") {
          sayHello();
          return;
        }
        if (!d) return;

        // 앱 테마(설정의 system/light/dark 결과)를 상단 바에 맞춘다(2026-11-04).
        if (d.type === "mcm:theme") {
          document.documentElement.dataset.theme = d.dark ? "dark" : "light";
          return;
        }
        if (d.type === "mcm:unread") {
          unreadCount = Number(d.count) || 0;
          pushBadge();
          if (bump("unread", d.latest)) await notifyIfAway(d.latest.title, d.latest.body);
          return;
        }
        if (d.type === "mcm:todo-due") {
          todoCount = Number(d.count) || 0;
          pushBadge();
          if (bump("todo", d.latest)) await notifyIfAway(d.latest.title, d.latest.body);
        }
      });
    </script>
  </body>
</html>

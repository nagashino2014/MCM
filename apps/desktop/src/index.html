<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>MCM</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <div id="bar" data-tauri-drag-region>
      <span id="title" data-tauri-drag-region>MCM</span>
      <div id="spacer" data-tauri-drag-region></div>

      <div id="pin" title="다른 창 위에 항상 표시합니다">
        <span>항상 위</span><span class="sw"></span>
      </div>

      <button class="btn" id="min" title="최소화" aria-label="최소화">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="btn" id="max" title="최대화 / 이전 크기" aria-label="최대화">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="btn close" id="close" title="닫기(트레이로 내려갑니다)" aria-label="닫기">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <iframe id="app" src="https://koensain.app/m-app" title="MCM"></iframe>
    <!-- PC 알림 브리지(1.6.0) — 같은 출처라 m-app 로그인 토큰으로 메일·결재·메신저 새 소식을 받아 온다(frontend/public/pc-notify-bridge.html). -->
    <iframe id="notify-bridge" src="https://koensain.app/pc-notify-bridge.html" title="알림" aria-hidden="true" tabindex="-1" style="display:none"></iframe>

    <script>
      const { getCurrentWindow } = window.__TAURI__.window;
      const { WebviewWindow } = window.__TAURI__.webviewWindow;
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const win = getCurrentWindow();
      const APP_ORIGIN = "https://koensain.app";

      const pin = document.getElementById("pin");
      let pinned = false;
      pin.addEventListener("click", async () => {
        pinned = !pinned;
        pin.classList.toggle("on", pinned);
        await win.setAlwaysOnTop(pinned);
      });

      document.getElementById("min").addEventListener("click", () => win.minimize());
      document.getElementById("max").addEventListener("click", () => win.toggleMaximize());
      // 닫기 = 종료가 아니라 트레이로(메신저는 계속 떠 있어야 알림을 받는다).
      document.getElementById("close").addEventListener("click", () => win.hide());

      /*
        웹앱(iframe) → 셸 브리지(WID-P1).
        iframe 은 원격 오리진이라 Tauri API 를 직접 못 쓴다. 대신 웹앱이 미읽음 폴링 결과를
        postMessage 로 올려주고, 여기서 트레이 뱃지·OS 알림으로 옮긴다.
      */
      // 웹앱은 셸의 오리진을 모르면 아무 것도 보내지 않는다 → 먼저 hello 로 밝힌다.
      const appFrame = document.getElementById("app");
      const sayHello = () => {
        try {
          // caps = 이 셸이 지원하는 기능. 웹앱은 여기에 없는 기능은 요청하지 않는다(옛 셸과의 호환, 2026-11-06).
          appFrame.contentWindow.postMessage({ type: "mcm:widget-hello", caps: ["chat-popup"] }, APP_ORIGIN);
        } catch (_) {
          /* 아직 로드 전 — 아래 재시도가 처리한다 */
        }
      };
      appFrame.addEventListener("load", () => {
        sayHello();
        // 웹앱(React)이 마운트되기 전일 수 있어 몇 번 더 두드린다.
        [500, 1500, 4000].forEach((ms) => setTimeout(sayHello, ms));
      });

      // 뱃지 = 메신저 미읽음 + 오늘 할 일(WID-P3). 둘은 따로 들어오므로 마지막 값을 합산한다.
      let unreadCount = 0;
      let todoCount = 0;
      const pushBadge = () => invoke("set_unread", { count: unreadCount + todoCount }).catch(() => {});

      /*
        OS 알림(1.6.0) — Rust show_toast(tauri-winrt-notification). 누르면 주 창이 앞으로 오고 mcm:toast-click 으로
        target 이 돌아와 그 화면으로 이동한다. 알림 플러그인(sendNotification)은 Windows 에서 클릭 이벤트가 없어 쓰지 않는다.
        켜고 끄기는 Windows 설정 > 시스템 > 알림 > MCM 에서 한다.
      */
      const mainAway = async () => {
        const [visible, focused] = await Promise.all([
          win.isVisible().catch(() => false),
          win.isFocused().catch(() => false),
        ]);
        return !(visible && focused);
      };
      const toast = (title, body, target) =>
        invoke("show_toast", { title: String(title || "MCM"), body: String(body || ""), target: target || { kind: "home" } }).catch(() => {});

      // 창을 보고 있는 중이면 알림은 군더더기다.
      const notifyIfAway = async (title, body, target) => {
        if (await mainAway()) await toast(title, body, target);
      };

      // 알림 클릭 → 그 화면. 대화는 개별 대화창, 메일·결재는 주 창을 그 문서 주소로 다시 연다(m-app 은 원격 웹이라 주소 이동이 유일한 길).
      const openTarget = async (t) => {
        if (!t || typeof t !== "object") return;
        if (t.kind === "chat") {
          if (Number(t.roomId) > 0) await openChatWindow(t.roomId, t.name);
          else appFrame.src = APP_ORIGIN + "/m-app/chat";
          return;
        }
        const id = typeof t.id === "string" && /^[A-Za-z0-9_-]+$/.test(t.id) ? t.id : "";
        if (t.kind === "mail") appFrame.src = APP_ORIGIN + "/m-app/mail" + (id ? "/" + id : "");
        else if (t.kind === "approval") appFrame.src = APP_ORIGIN + "/m-app/approval" + (id ? "/" + id : "");
        // home·todo 는 창을 앞으로 가져오는 것으로 끝(Rust 가 이미 했다).
      };
      listen("mcm:toast-click", (e) => { void openTarget(e.payload); }).catch(() => {});

      /*
        알림 브리지(1.6.0) — 숨은 iframe(koensain.app/pc-notify-bridge.html)이 15초마다 새 메일·내 차례 결재·내 문서 결과·
        메신저 새 메시지를 올린다. 브리지가 살아 있으면(최근 60초 안에 상태 수신) 메신저 알림은 브리지 것만 쓰고,
        웹앱이 올리는 mcm:unread 의 알림은 뱃지에만 쓴다(같은 메시지가 두 번 뜨지 않게). 브리지 파일이 아직 배포되지 않은
        서버에서는 예전처럼 mcm:unread 로 알린다.
      */
      const bridgeFrame = document.getElementById("notify-bridge");
      let bridgeSeenAt = 0;
      const bridgeLive = () => Date.now() - bridgeSeenAt < 60000;
      const helloBridge = () => {
        try {
          bridgeFrame.contentWindow.postMessage({ type: "mcm:bridge-hello" }, APP_ORIGIN);
        } catch (_) {
          /* 아직 로드 전 — load 이벤트가 다시 부른다 */
        }
      };
      bridgeFrame.addEventListener("load", () => {
        helloBridge();
        [1000, 4000].forEach((ms) => setTimeout(helloBridge, ms));
      });

      // 대화 알림은 그 방의 개별 대화창이 떠 있으면(보이는 중) 생략한다.
      const chatWindowShowing = async (roomId) => {
        try {
          const w = await WebviewWindow.getByLabel("chat-" + Number(roomId));
          return !!w && (await w.isVisible().catch(() => false)) && !(await w.isMinimized().catch(() => false));
        } catch (_) {
          return false;
        }
      };
      const onBridgeItems = async (items) => {
        if (!Array.isArray(items) || !items.length) return;
        if (!(await mainAway())) return;
        for (const it of items.slice(0, 10)) {
          if (!it || typeof it !== "object") continue;
          const t = it.target && typeof it.target === "object" ? it.target : { kind: it.kind };
          if (t.kind === "chat" && Number(t.roomId) > 0 && (await chatWindowShowing(t.roomId))) continue;
          await toast(String(it.title || "").slice(0, 120), String(it.body || "").slice(0, 300), t);
        }
      };

      // 처음 받은 값은 기준선으로만 쓴다 — 켜자마자 쌓여 있던 미읽음·오늘 할 일로 알림이 쏟아지면 안 된다.
      // 메신저는 최근 메시지 키, 할 일은 날짜 키(하루 1회)로 각각 변화를 본다.
      const lastSeen = { unread: null, todo: null };
      const bump = (kind, latest) => {
        if (!latest || !latest.key) return false;
        const first = lastSeen[kind] === null;
        const changed = latest.key !== lastSeen[kind];
        lastSeen[kind] = latest.key;
        return !first && changed;
      };

      /*
        대화 팝업 창(2026-11-06) — 대화 2분할에서 이미 방이 열려 있을 때 새 대화를 별도 창으로 띄운다.
        창 라벨은 chat-<roomId>: 같은 방을 다시 열면 새 창을 만들지 않고 있던 창을 앞으로 가져온다.
        화면은 chat.html(상단 바 + 원격 대화방 iframe). 크기는 apps/mobile/src/lib/chat-popup.ts 의 브라우저 팝업과 같다.
      */
      const openChatWindow = async (rawId, rawName) => {
        const roomId = Number(rawId);
        if (!Number.isSafeInteger(roomId) || roomId <= 0) return;
        const name = typeof rawName === "string" ? rawName.slice(0, 80) : "";
        const label = "chat-" + roomId;
        try {
          const existing = await WebviewWindow.getByLabel(label);
          if (existing) {
            await existing.unminimize();
            await existing.show();
            await existing.setFocus();
            return;
          }
          const qs = new URLSearchParams({ roomId: String(roomId) });
          if (name) qs.set("name", name);
          new WebviewWindow(label, {
            url: "chat.html?" + qs.toString(),
            title: name ? name + " — MCM" : "MCM 대화",
            width: 480,
            height: 720,
            minWidth: 360,
            minHeight: 480,
            resizable: true,
            decorations: false,
            shadow: true,
            dragDropEnabled: false,
          });
        } catch (_) {
          /* 창 생성 실패 — 웹앱 쪽에는 알릴 길이 없다(대화방은 목록에서 다시 열 수 있다) */
        }
      };

      window.addEventListener("message", async (e) => {
        if (e.origin !== APP_ORIGIN) return;
        const d = e.data;
        // 알림 브리지에서 온 것.
        if (e.source === bridgeFrame.contentWindow) {
          if (!d) return;
          if (d.type === "mcm:bridge-loaded") helloBridge();
          else if (d.type === "mcm:bridge-ready") bridgeSeenAt = Date.now();
          else if (d.type === "mcm:bridge-status") { if (d.status === "ok") bridgeSeenAt = Date.now(); }
          else if (d.type === "mcm:pc-notify") { bridgeSeenAt = Date.now(); await onBridgeItems(d.items); }
          return;
        }
        if (d && d.type === "mcm:widget-ready") {
          sayHello();
          return;
        }
        if (!d) return;

        // 앱 테마(설정의 system/light/dark 결과)를 상단 바에 맞춘다(2026-11-04).
        if (d.type === "mcm:theme") {
          document.documentElement.dataset.theme = d.dark ? "dark" : "light";
          return;
        }
        if (d.type === "mcm:open-chat") {
          await openChatWindow(d.roomId, d.name);
          return;
        }
        if (d.type === "mcm:unread") {
          unreadCount = Number(d.count) || 0;
          pushBadge();
          if (bump("unread", d.latest) && !bridgeLive()) {
            // 브리지가 없는 서버(배포 전)용 — 예전 경로. 키가 "<roomId>:<시각>" 이라 방 번호로 대화창을 열 수 있다.
            const roomId = Number(String(d.latest.key).split(":")[0]);
            await notifyIfAway(d.latest.title, d.latest.body, roomId > 0 ? { kind: "chat", roomId, name: d.latest.title } : { kind: "chat" });
          }
          return;
        }
        if (d.type === "mcm:todo-due") {
          todoCount = Number(d.count) || 0;
          pushBadge();
          if (bump("todo", d.latest)) await notifyIfAway(d.latest.title, d.latest.body, { kind: "todo" });
        }
      });
    </script>
  </body>
</html>

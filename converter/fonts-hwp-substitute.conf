<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 한컴 전용 서체 → 자유 라이선스 대체 서체 매핑(HWPX → PDF 변환용).
       증명서 서식(frontend/public/hwpx/certificate-*.hwpx)은 휴먼명조를 쓰는데
       리눅스 컨테이너에는 없어 그대로 두면 고딕(Noto Sans)으로 대체된다 —
       나눔명조(fonts-nanum)로 강제해 명조 인쇄 품질을 유지한다(2026-09-01). -->
  <match target="pattern">
    <test qual="any" name="family"><string>휴먼명조</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumMyeongjo</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HumanMyeongjo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumMyeongjo</string></edit>
  </match>
</fontconfig>
